<!DOCTYPE html>
<html lang="en" class="transition duration-300">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expert Simulation Dashboard (Basic)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-indigo-100 text-gray-800 dark:from-gray-900 dark:to-gray-800 dark:text-gray-100 min-h-screen p-6 transition duration-300">
  <div class="max-w-6xl mx-auto bg-white dark:bg-gray-900 shadow-2xl rounded-2xl p-8 space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
      <h2 class="text-3xl font-bold text-indigo-600 dark:text-indigo-300">Expert Simulation Dashboard (Basic)</h2>
      <button id="darkToggle" class="w-14 h-8 bg-gray-300 dark:bg-gray-700 rounded-full p-1 flex items-center">
        <div id="toggleIcon" class="bg-white dark:bg-gray-800 w-6 h-6 rounded-full shadow-md transform transition-all duration-300 flex items-center justify-center text-sm">
          <span id="iconSymbol">☀️</span>
        </div>
      </button>
    </div>

    <!-- Dynamic UI -->
    <div id="main-ui"></div>

    <!-- Plot Display -->
    <div id="plot-container" class="mt-8 rounded-lg overflow-hidden shadow-inner bg-gray-100 dark:bg-gray-800 p-4 min-h-[800px] border dark:border-gray-700">
      <p class="text-gray-500 dark:text-gray-400 italic text-center">Please select inputs to display the plot.</p>
    </div>

    <!-- Download -->
    <div class="text-center pt-6">
      <button id="downloadBtn" class="px-6 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600">
        Download Plot as HTML
      </button>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-green-500 text-white text-sm px-4 py-2 rounded shadow-lg hidden transition-opacity duration-300">Plot updated!</div>
  </div>

<script>
  const htmlEl = document.documentElement;
  const toggle = document.getElementById("darkToggle");
  const toggleIcon = document.getElementById("toggleIcon");
  const iconSymbol = document.getElementById("iconSymbol");
  let darkMode = false;
  function setTheme(isDark) {
    darkMode = isDark;
    htmlEl.classList.toggle("dark", isDark);
    iconSymbol.innerText = isDark ? "🌙" : "☀️";
    toggleIcon.style.transform = isDark ? "translateX(24px)" : "translateX(0px)";
  }
  toggle.addEventListener("click", () => setTheme(!darkMode));
  window.addEventListener("DOMContentLoaded", () => {
    setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
  });

  const tauToErrorMap = {
    "0.1": ["0.1"],
    "0.2": ["0.02", "0.06", "0.1", "0.14"],
    "0.3": ["0.1"],
    "0.4": ["0.1"]
  };
  const errorToTauMap = {
    "0.02": ["0.2"],
    "0.06": ["0.2"],
    "0.1": ["0.1", "0.2", "0.3", "0.4"],
    "0.14": ["0.2"]
  };

  const mainUI = document.getElementById("main-ui");
  mainUI.innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="font-semibold block mb-1" for="experts-main">Number of Experts:</label>
        <select id="experts-main" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
          <option value="">-- Select --</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div>
        <label class="font-semibold block mb-2">What would you like to analyze?</label>
        <div class="flex flex-col gap-2">
          <label class="inline-flex items-center">
            <input type="radio" name="analysis-mode" value="across" class="form-radio h-4 w-4 text-indigo-600 dark:bg-gray-800" />
            <span class="ml-2">Across Correlations</span>
          </label>
          <label class="inline-flex items-center">
            <input type="radio" name="analysis-mode" value="specific" class="form-radio h-4 w-4 text-indigo-600 dark:bg-gray-800" />
            <span class="ml-2">Specific Correlation</span>
          </label>
        </div>
      </div>
    </div>
    <div id="mode-ui" class="mt-6"></div>
  `;

  const expertsSelect = document.getElementById("experts-main");
  const modeUI = document.getElementById("mode-ui");

  document.querySelectorAll("input[name='analysis-mode']").forEach(radio => {
    radio.addEventListener("change", () => {
      const mode = radio.value;
      if (!expertsSelect.value) return alert("Please select number of experts first.");
      renderModeUI(mode, expertsSelect.value);
    });
  });

  expertsSelect.addEventListener("change", () => {
    updatePlot();
  });

  function updateTauErrorLinkage(tauId, errorId) {
    const tauSelect = document.getElementById(tauId);
    const errorSelect = document.getElementById(errorId);

    const tauVal = tauSelect.value;
    const errorVal = errorSelect.value;

    Array.from(errorSelect.options).forEach(opt => {
      opt.disabled = !tauToErrorMap[tauVal].includes(opt.value);
    });
    Array.from(tauSelect.options).forEach(opt => {
      opt.disabled = !errorToTauMap[errorVal].includes(opt.value);
    });
  }

  function renderModeUI(mode, experts) {
    if (mode === "across") {
      modeUI.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="font-semibold block mb-1" for="across-tau">Tau:</label>
            <select id="across-tau" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
              <option value="0.1">0.1</option>
              <option value="0.2" selected>0.2</option>
              <option value="0.3">0.3</option>
              <option value="0.4">0.4</option>
            </select>
          </div>
          <div>
            <label class="font-semibold block mb-1" for="across-error">Error Bound:</label>
            <select id="across-error" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
              <option value="0.02">0.02</option>
              <option value="0.06">0.06</option>
              <option value="0.1" selected>0.1</option>
              <option value="0.14">0.14</option>
            </select>
          </div>
          <div class="sm:col-span-3 text-right">
            <button id="reset-across" class="mt-2 px-4 py-1 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm">
              Reset Tau & Error Bound
            </button>
          </div>
        </div>
      `;
      document.getElementById("reset-across").onclick = () => {
        document.getElementById("across-tau").value = "0.2";
        document.getElementById("across-error").value = "0.1";
        updateTauErrorLinkage("across-tau", "across-error");
        updatePlot();
      };
      ["across-tau", "across-error"].forEach(id => {
        const el = document.getElementById(id);
        el.onchange = () => {
          updateTauErrorLinkage("across-tau", "across-error");
          updatePlot();
        };
      });
      updatePlot();
    } else {
      modeUI.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="font-semibold block mb-1" for="correlation">Correlation Between Teams:</label>
            <select id="correlation" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
              <option value="0.1">0.1</option>
              <option value="0.2">0.2</option>
              <option value="0.3">0.3</option>
              <option value="0.4" selected>0.4</option>
              <option value="0.5">0.5</option>
              <option value="0.6">0.6</option>
              <option value="0.7">0.7</option>
              <option value="0.8">0.8</option>
              <option value="0.9">0.9</option>
            </select>
          </div>
          <div>
            <label class="font-semibold block mb-1" for="plot-type">Choose Plot Type:</label>
            <select id="plot-type" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
              <option value="">--Select--</option>
              <option value="fstat">Mean Winnings and Selection Ratios across 2 dimensions</option>
              <option value="3d">Summary Plots</option>
            </select>
          </div>
        </div>
        <div id="fstat-options" class="hidden mt-4">
          <label class="font-semibold block mb-1" for="fstat-type">Compare Across:</label>
          <select id="fstat-type" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
            <option value="beta">Error Bounds (beta), Tau = 0.2</option>
            <option value="tau">Taus, Beta = 0.1</option>
          </select>
        </div>
        <div id="three-d-options" class="hidden mt-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="font-semibold block mb-1">Tau:</label>
              <select id="three-d-tau" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
                <option value="0.1">0.1</option>
                <option value="0.2" selected>0.2</option>
                <option value="0.3">0.3</option>
                <option value="0.4">0.4</option>
              </select>
            </div>
            <div>
              <label class="font-semibold block mb-1">Error Bound:</label>
              <select id="three-d-error" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
                <option value="0.02">0.02</option>
                <option value="0.06">0.06</option>
                <option value="0.1" selected>0.1</option>
                <option value="0.14">0.14</option>
              </select>
            </div>
            <div class="flex items-end">
              <button id="three-d-reset" class="w-full px-4 py-1 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm">Reset Tau & Error Bound</button>
            </div>
          </div>
          <div class="mt-4">
            <label class="font-semibold block mb-1" for="three-d-config">Expert Configuration:</label>
            <select id="three-d-config" class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600">
              <option value="Equi-mean_Equivariance">Equi-mean Equivariance</option>
              <option value="Unequal-mean_Equivariance">Unequal-mean Equivariance</option>
              <option value="Equi-mean_Unequal-std">Equi-mean Unequal-std</option>
              <option value="Unequal-mean_Unequal-std">Unequal-mean Unequal-std</option>
            </select>
          </div>
        </div>
      `;
      document.getElementById("plot-type").onchange = () => {
        const pt = document.getElementById("plot-type").value;
        document.getElementById("fstat-options").classList.toggle("hidden", pt !== "fstat");
        document.getElementById("three-d-options").classList.toggle("hidden", pt !== "3d");
        updatePlot();
      };
      ["correlation", "fstat-type", "three-d-tau", "three-d-error", "three-d-config"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.onchange = updatePlot;
      });
      document.getElementById("three-d-tau").onchange = () => {
        updateTauErrorLinkage("three-d-tau", "three-d-error");
        updatePlot();
      };
      document.getElementById("three-d-error").onchange = () => {
        updateTauErrorLinkage("three-d-tau", "three-d-error");
        updatePlot();
      };
      document.getElementById("three-d-reset").onclick = () => {
        document.getElementById("three-d-tau").value = "0.2";
        document.getElementById("three-d-error").value = "0.1";
        updateTauErrorLinkage("three-d-tau", "three-d-error");
        updatePlot();
      };
      updatePlot();
    }
  }

  function updatePlot() {
    const experts = document.getElementById("experts-main")?.value;
    const mode = document.querySelector("input[name='analysis-mode']:checked")?.value;
    let path = "";

    if (mode === "across") {
      const tau = document.getElementById("across-tau")?.value;
      const error = document.getElementById("across-error")?.value;
      path = `Multi_corrns/Variation_Plots/Experts=${experts}/Tau=${tau}_Error=${error}.html`;
    } else if (mode === "specific") {
      const corr = document.getElementById("correlation")?.value;
      const plotType = document.getElementById("plot-type")?.value;
      if (plotType === "fstat") {
        const fstatType = document.getElementById("fstat-type")?.value;
        path = `Basic_with_leadership_Abbreviated/Experts=${experts}/${corr}/MeanWinnings_SelRatio_Variation_with_${fstatType}.html`;
      } else if (plotType === "3d") {
        const tau = document.getElementById("three-d-tau")?.value;
        const error = document.getElementById("three-d-error")?.value;
        const config = document.getElementById("three-d-config")?.value;
        path = `Basic_with_leadership_Abbreviated/Experts=${experts}/${corr}/Tau=${tau}_ErrorBound=${error}/Plots/Summary_${config}.html`;
      }
    }

    const plotContainer = document.getElementById("plot-container");
    if (path) {
      plotContainer.innerHTML = `<iframe id='plot-frame' src='${path}' class='w-full h-[750px] rounded-lg border dark:border-gray-600'></iframe>`;
      showToast();
    }
  }

  function showToast() {
    const toast = document.getElementById("toast");
    toast.classList.remove("hidden");
    toast.style.opacity = 1;
    setTimeout(() => {
      toast.style.opacity = 0;
      setTimeout(() => toast.classList.add("hidden"), 300);
    }, 1500);
  }

    document.getElementById("downloadBtn").addEventListener("click", () => {
    const iframe = document.getElementById("plot-frame");
    const src = iframe?.src;
    if (src) {
      const a = document.createElement("a");
      a.href = src;
      a.download = "plot.html";
      a.click();
    } else {
      alert("Please select a plot to download.");
    }
  });
</script>
</body>
</html>
